name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag in vX.Y.Z form"
        required: true
      upload_to_release:
        description: "Upload zip to the release"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out requested tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/packaging.txt

      - name: Validate release tag and version
        id: release
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          $VersionOutput = & python scripts/check_release_version.py --tag $env:REQUESTED_TAG --verify-head
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag validation failed"
          }
          $Version = ([string]$VersionOutput).Trim()
          "version=$Version" >> $env:GITHUB_OUTPUT
          "archive=dist/ZipPictureViewer-v$Version-windows-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/packaging.txt -e ".[dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

      - name: Build and validate Windows app
        shell: pwsh
        env:
          REQUIRE_CLEAN_PROVENANCE: "1"
        run: scripts/build_windows_app.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZipPictureViewer-v${{ steps.release.outputs.version }}-windows-x64
          path: |
            ${{ steps.release.outputs.archive }}
            ${{ steps.release.outputs.archive }}.sha256
          if-no-files-found: error

      - name: Upload release asset
        if: ${{ inputs.upload_to_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag_name }}
          ARCHIVE_PATH: ${{ steps.release.outputs.archive }}
        run: |
          gh release upload $env:REQUESTED_TAG `
            $env:ARCHIVE_PATH `
            "$env:ARCHIVE_PATH.sha256" `
            --clobber

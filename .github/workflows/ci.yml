name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the end-to-end test runner
        run: python -m pip install -r tests/requirements.txt

      - name: Build
        run: swift build

      - name: End-to-end tests (debug build)
        run: python -m pytest -q

      - name: Build the app bundle
        run: Scripts/build_app.sh release

      - name: Smoke test the bundle
        run: dist/ZipPictureViewer.app/Contents/MacOS/ZipPictureViewer --smoke-test

      - name: Smoke test the x86_64 slice under Rosetta
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::Rosetta is not available; the x86_64 slice was not run"
            exit 0
          fi
          arch -x86_64 dist/ZipPictureViewer.app/Contents/MacOS/ZipPictureViewer --smoke-test

      - name: End-to-end tests (app bundle)
        env:
          ZPV_E2E_APP: ${{ github.workspace }}/dist/ZipPictureViewer.app/Contents/MacOS/ZipPictureViewer
        run: python -m pytest -q

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: ZipPictureViewer-mac
          path: dist/ZipPictureViewer-v*-mac.zip
          if-no-files-found: error

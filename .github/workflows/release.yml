name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag in vX.Y.Z form; must match VERSION"
        required: true
      upload_to_release:
        description: "Upload the zip and checksum to the GitHub release (creates a draft if none exists)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      NOTARYTOOL_PROFILE: zip-picture-viewer-release
    steps:
      - name: Check the tag format
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3, got: $RELEASE_TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Check the tag matches VERSION
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "v$VERSION" != "$RELEASE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match VERSION $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release secrets
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY \
                      MACOS_NOTARY_APPLE_ID MACOS_NOTARY_TEAM_ID MACOS_NOTARY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing release secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the end-to-end test runner
        run: python -m pip install -r tests/requirements.txt

      # A throwaway keychain keeps the certificate off the runner's login keychain
      # and lets codesign use it without a password prompt.
      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/release.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "RELEASE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERTIFICATE_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -qF "$MACOS_SIGNING_IDENTITY"; then
            echo "MACOS_SIGNING_IDENTITY is not among the imported identities" >&2
            exit 1
          fi

      - name: Store notarization credentials
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "$NOTARYTOOL_PROFILE" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --keychain "$RELEASE_KEYCHAIN_PATH"

      # NOTARYTOOL_PROFILE is cleared here so the bundle is tested before it is notarized.
      - name: Build and sign the universal app
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          REQUIRE_RELEASE_SIGNING: "1"
          NOTARYTOOL_PROFILE: ""
        run: Scripts/build_app.sh release

      - name: Smoke test the bundle
        run: dist/ZipPictureViewer.app/Contents/MacOS/ZipPictureViewer --smoke-test

      - name: Smoke test the x86_64 slice under Rosetta
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::Rosetta is not available; the x86_64 slice was not run"
            exit 0
          fi
          arch -x86_64 dist/ZipPictureViewer.app/Contents/MacOS/ZipPictureViewer --smoke-test

      - name: End-to-end tests (app bundle)
        env:
          ZPV_E2E_APP: ${{ github.workspace }}/dist/ZipPictureViewer.app/Contents/MacOS/ZipPictureViewer
        run: python -m pytest -q

      - name: Notarize, staple and package
        run: NOTARYTOOL_KEYCHAIN="$RELEASE_KEYCHAIN_PATH" Scripts/notarize_app.sh dist/ZipPictureViewer.app

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZipPictureViewer-v${{ steps.version.outputs.version }}-mac
          path: |
            dist/ZipPictureViewer-v${{ steps.version.outputs.version }}-mac.zip
            dist/ZipPictureViewer-v${{ steps.version.outputs.version }}-mac.zip.sha256
          if-no-files-found: error

      - name: Upload to the GitHub release
        if: ${{ inputs.upload_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: dist/ZipPictureViewer-v${{ steps.version.outputs.version }}-mac.zip
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
              --title "ZipPictureViewer $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

      - name: Delete the temporary keychain
        if: ${{ always() }}
        run: |
          if [[ -n "${RELEASE_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN_PATH" || true
          fi

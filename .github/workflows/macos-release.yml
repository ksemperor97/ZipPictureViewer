name: macOS Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag in vX.Y.Z form"
        required: true
      upload_to_release:
        description: "Upload zip and checksum to the release"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Check out requested tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/packaging.txt

      - name: Validate release tag and version
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          VERSION="$(python scripts/check_release_version.py --tag "$REQUESTED_TAG" --verify-head)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/packaging.txt -e ".[dev]"

      - name: Run end-to-end tests from source
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

      - name: Validate release secrets
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          required=(
            MACOS_CERTIFICATE_BASE64
            MACOS_CERTIFICATE_PASSWORD
            MACOS_SIGNING_IDENTITY
            MACOS_NOTARY_APPLE_ID
            MACOS_NOTARY_TEAM_ID
            MACOS_NOTARY_PASSWORD
          )
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing required release secret: $variable_name" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/zip-picture-viewer-release.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/zip-picture-viewer-release.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "RELEASE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          export CERTIFICATE_PATH
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(
              base64.b64decode(os.environ["MACOS_CERTIFICATE_BASE64"], validate=True)
          )
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      - name: Store notarization credentials
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "zip-picture-viewer-release" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --keychain "$RELEASE_KEYCHAIN_PATH"

      - name: Build, sign, notarize, and validate macOS app
        env:
          REQUIRE_RELEASE_SIGNING: "1"
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARYTOOL_PROFILE: zip-picture-viewer-release
        run: NOTARYTOOL_KEYCHAIN="$RELEASE_KEYCHAIN_PATH" scripts/build_macos_app.sh

      - name: Locate macOS package
        id: package
        run: |
          shopt -s nullglob
          archives=(dist/ZipPictureViewer-v${{ steps.release.outputs.version }}-mac-*-slim.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected one formal macOS archive, found ${#archives[@]}" >&2
            exit 1
          fi
          echo "name=$(basename "${archives[0]}" .zip)" >> "$GITHUB_OUTPUT"
          echo "path=${archives[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.path }}.sha256
          if-no-files-found: error

      - name: Upload release assets
        if: ${{ inputs.upload_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag_name }}
          ARCHIVE_PATH: ${{ steps.package.outputs.path }}
        run: |
          gh release upload "$REQUESTED_TAG" \
            "$ARCHIVE_PATH" \
            "$ARCHIVE_PATH.sha256" \
            --clobber

      - name: Delete temporary keychain
        if: ${{ always() }}
        run: |
          if [[ -n "${RELEASE_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN_PATH" || true
          fi
